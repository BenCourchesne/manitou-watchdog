name: Keepalive

# Empeche GitHub de desactiver les workflows planifies apres 60 jours
# sans activite dans le repo : un commit vide mensuel garde le repo "actif".

on:
  schedule:
    - cron: "0 8 1 * *"   # le 1er de chaque mois a 08:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit vide pour garder le cron actif
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive (garde les workflows planifies actifs)"
          git push
