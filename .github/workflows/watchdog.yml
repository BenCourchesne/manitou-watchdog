name: Manitou Firebase Watchdog

on:
  schedule:
    - cron: "*/15 * * * *"   # toutes les 15 min (GitHub peut retarder de quelques min)
  workflow_dispatch: {}       # bouton "Run workflow" pour tester a la main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run watchdog
        run: python watchdog.py
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER:  ${{ secrets.PUSHOVER_USER }}
          # Optionnel: surcharger les seuils
          # MAX_READINGS_AGE_MIN: "30"
          MAX_DAILY_AGE_H: "1"   # TEST TEMPORAIRE - force une alerte pour valider Pushover
